# Blueprint de Render: sitio estático (React + Vite).
# En Render: New > Blueprint > conecta el repositorio. Render detecta este archivo.
services:
  - type: web
    name: planta-iot-duelo
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
