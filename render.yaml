# Blueprint de Render: servicio web Node (sirve la app React y las salas en línea por WebSocket).
# En Render: New > Blueprint > conecta el repositorio. Render detecta este archivo.
services:
  - type: web
    name: planta-iot-duelo
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
